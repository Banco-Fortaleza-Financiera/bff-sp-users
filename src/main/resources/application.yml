server:
  port: 8888

spring:
  application:
    name: ${projectName}
  cache:
    type: redis
    redis:
      time-to-live: ${REDIS_CACHE_TTL:5m}
      cache-null-values: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:mi_password_seguro}
  datasource:
    url: ${DB_URL:jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:14330};databaseName=${DB_NAME:bdd_bff_central};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:true}}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:TuPasswordFuerte123!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ${projectName}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] [%X{method:-} %X{path:-}] [%X{deviceIp:-unknown-ip}] %logger{36} - %msg%n"
  level:
    com.bancofortaleza.accounts: info
    org.springframework.web: warn

spring.cloud.openfeign:
  okhttp:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000
        loggerLevel: basic
      customer-profile:
        url: https://example.com

  
